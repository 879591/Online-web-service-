<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for safe-zone -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />

  <!-- Outer tech glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 12" opacity="0.3" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyan-blue)" stroke-width="4" opacity="0.5" />

  <!-- Digital Hexagon badge -->
  <polygon points="256,120 376,190 376,330 256,400 136,330 136,190" fill="#0f172a" stroke="url(#cyan-blue)" stroke-width="8" filter="url(#glow)" />

  <!-- Stylized Monogram S / Code bracket / Rocket element -->
  <path d="M200 195 L165 256 L200 317" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M312 195 L347 256 L312 317" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Dynamic "S" symbol in gold-cyan gradient -->
  <path d="M295 210 C295 210 240 200 230 225 C218 255 295 260 282 300 C270 335 215 320 215 320" fill="none" stroke="url(#gold-accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Digital Sparkles / Stars -->
  <circle cx="360" cy="160" r="8" fill="#fde047" />
  <circle cx="150" cy="350" r="6" fill="#38bdf8" />
  <circle cx="256" cy="155" r="5" fill="#38bdf8" />
</svg>
